# 本仓的格式化与检查配置，由 scripts/format.sh 读入（各项含义见那里）。
# 字节必须保持不变的文件（git pathspec）；与 .prettierignore 保持一致。
# third_party/：上游许可证与通知，含按哈希固定的文件，NOTICE.md 按字节嵌入 EXE 并与发布件比对。
EXCLUDE=(':(exclude)third_party/**' ':(exclude)**/dist/**')
PRETTIER=npx
SHFMT=1
SHELLCHECK=1
GOFMT=1
LINES_EXT=(go js mjs cjs jsx ts mts cts tsx)
