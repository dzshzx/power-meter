name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version step from the highest vX.Y.Z tag (minor and major need maintainer approval)
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: Build and verify only; no tag and no Release
        type: boolean
        default: false
      gate:
        description: 跑全量门禁；默认不跑，合入门禁与每晚 CI 已查过
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs before the gate so that an already released commit fails early.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # A tagged commit whose Release is not published resumes that version;
      # see tools/release next-version.
      - name: Compute release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: go run ./tools/release next-version -bump "$BUMP" -branch "$DEFAULT_BRANCH" -dry-run="$DRY_RUN" >> "$GITHUB_OUTPUT"

  # Builds on Linux, and smoke- and installer-tests on Windows, the files
  # this run publishes. The gate (scripts/check.sh and the Go tests on
  # Windows) runs only with gate on and then stops the release when it
  # fails; off, it is skipped: every commit passed the gate at wt land.
  validate:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      skip_gate: ${{ !inputs.gate }}

  release:
    needs: [version, validate]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist/windows-amd64

      # The asset directory holds exactly the Release assets; package also
      # checks the executable's file version and every checksum.
      - name: Package release assets
        run: go run ./tools/release package -version "$VERSION" -build dist/windows-amd64 -out "$RUNNER_TEMP/release-assets"

      # Writes the run summary; unless dry_run, publishes the Release and tags
      # the commit (see tools/release publish for the order and recovery).
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: go run ./tools/release publish -version "$VERSION" -assets "$RUNNER_TEMP/release-assets" -dry-run="$DRY_RUN"
