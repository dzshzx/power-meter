name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version step from the highest vX.Y.Z tag (minor and major need maintainer approval)
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: Build and verify only; no tag and no Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Gate (scripts/check.sh)
        run: bash scripts/check.sh

  release:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute release version
        id: version
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          $dryRun = $env:DRY_RUN -eq 'true'
          if (-not $dryRun -and $env:GITHUB_REF -ne "refs/heads/$env:DEFAULT_BRANCH") {
              throw "A release (dry_run=false) must run on $env:DEFAULT_BRANCH; this run is on $env:GITHUB_REF."
          }

          $releaseTag = '^v\d+\.\d+\.\d+$'
          $tags = @(git tag --list 'v*' | Where-Object { $_ -match $releaseTag })
          if ($LASTEXITCODE -ne 0) { throw 'Could not list tags.' }
          if ($tags.Count -eq 0) { throw 'No vX.Y.Z tag found; the version baseline is unknown.' }

          $headTags = @(git tag --points-at $env:GITHUB_SHA | Where-Object { $_ -match $releaseTag })
          if ($LASTEXITCODE -ne 0) { throw 'Could not list tags on the source commit.' }
          if ($headTags.Count -gt 0 -and -not $dryRun) {
              throw "这个提交已发过版: $env:GITHUB_SHA already carries $($headTags -join ', ')."
          }

          $base = $tags | ForEach-Object { [version]$_.Substring(1) } |
              Sort-Object -Descending | Select-Object -First 1
          $next = switch ($env:BUMP) {
              'patch' { [version]::new($base.Major, $base.Minor, $base.Build + 1) }
              'minor' { [version]::new($base.Major, $base.Minor + 1, 0) }
              'major' { [version]::new($base.Major + 1, 0, 0) }
              default { throw "Unknown bump: $env:BUMP" }
          }
          # Each manifest version field is a 16-bit number.
          if ($next.Major -gt 65535 -or $next.Minor -gt 65535 -or $next.Build -gt 65535) {
              throw "Version $next does not fit the Windows manifest."
          }
          $version = $next.ToString(3)

          Write-Host "Baseline v$($base.ToString(3)), bump $env:BUMP -> v$version (dry_run=$dryRun)"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Write release version into the manifest
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = 'src/BatteryChargeMeter.manifest'
          $text = [IO.File]::ReadAllText($path)
          $pattern = '(<assemblyIdentity\s+version=")0\.0\.0\.0(")'
          if ([regex]::Matches($text, $pattern).Count -ne 1) {
              throw 'The manifest must carry the 0.0.0.0 development placeholder exactly once.'
          }
          $text = [regex]::Replace($text, $pattern, "`${1}$env:VERSION.0`${2}")
          [IO.File]::WriteAllText($path, $text, [Text.UTF8Encoding]::new($false))

      - name: Install Inno Setup 7 (pinned, SHA-256 verified)
        shell: pwsh
        run: . ./scripts/inno-setup.ps1; Install-InnoSetup

      - name: Install Pester (test scripts need 6.x in both PowerShell editions)
        shell: pwsh
        run: Save-PSResource -Name Pester -Version 6.2.0 -Repository PSGallery -TrustRepository -Path "$env:ProgramFiles\WindowsPowerShell\Modules"

      - name: Test application and Release packages
        shell: pwsh
        run: ./scripts/test.ps1 -RequireInstaller

      - name: Check NuGet dependency licenses (SPDX allowlist)
        shell: pwsh
        run: ./scripts/check-licenses.ps1

      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-report
          path: |
            dist/test-report.json
            dist/ui-preview/
          if-no-files-found: warn

      - name: Package
        id: package
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $package = ./scripts/package-release.ps1 `
            -Tag $env:TAG `
            -ExecutablePath 'dist/PowerMeter.exe' `
            -OutputDirectory $env:RUNNER_TEMP `
            -Formats 'Portable', 'Installer'

          "binary=$($package.BinaryPath)" >> $env:GITHUB_OUTPUT
          "checksum=$($package.ChecksumPath)" >> $env:GITHUB_OUTPUT
          "installer=$($package.InstallerPath)" >> $env:GITHUB_OUTPUT
          "installer_checksum=$($package.InstallerChecksumPath)" >> $env:GITHUB_OUTPUT
          "notices=$($package.NoticesPath)" >> $env:GITHUB_OUTPUT
          "notices_checksum=$($package.NoticesChecksumPath)" >> $env:GITHUB_OUTPUT
          "source_bundle=$($package.SourceBundlePath)" >> $env:GITHUB_OUTPUT
          "source_bundle_checksum=$($package.SourceBundleChecksumPath)" >> $env:GITHUB_OUTPUT

      - name: Check artifact versions
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./scripts/assert-release-version.ps1 `
            -Version $env:VERSION `
            -PortablePath '${{ steps.package.outputs.binary }}' `
            -InstallerPath '${{ steps.package.outputs.installer }}' |
            Format-List

      - name: Summarize release
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          $assets = @(
            '${{ steps.package.outputs.binary }}',
            '${{ steps.package.outputs.checksum }}',
            '${{ steps.package.outputs.installer }}',
            '${{ steps.package.outputs.installer_checksum }}',
            '${{ steps.package.outputs.notices }}',
            '${{ steps.package.outputs.notices_checksum }}',
            '${{ steps.package.outputs.source_bundle }}',
            '${{ steps.package.outputs.source_bundle_checksum }}'
          )
          $heading = if ($env:DRY_RUN -eq 'true') { "Dry run: would release $env:TAG" } else { "Releasing $env:TAG" }
          $lines = @(
            "## $heading", '',
            "- version: ``$env:TAG``",
            "- source_commit: ``$env:GITHUB_SHA``", '',
            '| asset | sha256 |', '| --- | --- |'
          )
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            $lines += "| $(Split-Path -Leaf $asset) | ``$hash`` |"
          }
          $lines | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          $lines | Write-Host

      # The order keeps a failed run from leaving a tag: the Release is created
      # as a draft with every asset first, the annotated tag is pushed after
      # that, and publishing the draft is the last step.
      - name: Create draft Release
        id: draft
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create $env:TAG `
            '${{ steps.package.outputs.binary }}' `
            '${{ steps.package.outputs.checksum }}' `
            '${{ steps.package.outputs.installer }}' `
            '${{ steps.package.outputs.installer_checksum }}' `
            '${{ steps.package.outputs.notices }}' `
            '${{ steps.package.outputs.notices_checksum }}' `
            '${{ steps.package.outputs.source_bundle }}' `
            '${{ steps.package.outputs.source_bundle_checksum }}' `
            --repo $env:GITHUB_REPOSITORY `
            --draft `
            --target $env:GITHUB_SHA `
            --title $env:TAG `
            --notes "source_commit: $env:GITHUB_SHA" `
            --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create exited with $LASTEXITCODE." }

      - name: Push annotated tag
        id: tag
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a $env:TAG -m "Release $env:TAG" $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Could not create tag $env:TAG." }
          git push origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not push tag $env:TAG." }

      - name: Publish Release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release edit $env:TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw "gh release edit exited with $LASTEXITCODE." }

      - name: Remove the draft Release when no tag was pushed
        if: ${{ failure() && !inputs.dry_run && steps.draft.outcome != 'skipped' && steps.tag.outcome != 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null | ConvertFrom-Json
          if ($release -and $release.isDraft) {
              gh release delete $env:TAG --repo $env:GITHUB_REPOSITORY --yes
              if ($LASTEXITCODE -ne 0) { throw "gh release delete exited with $LASTEXITCODE." }
          }
          # gh release view exits non-zero when no Release exists; that is fine here.
          exit 0
