name: Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Check locks
        run: |
          uv lock --check
          uv lock --check --script scripts/make-icon.py

      - name: Install Inno Setup 7 (pinned, SHA-256 verified)
        shell: pwsh
        run: . ./scripts/inno-setup.ps1; Install-InnoSetup

      - name: Install Pester (test scripts need 6.x in both PowerShell editions)
        shell: pwsh
        run: Save-PSResource -Name Pester -Version 6.2.0 -Repository PSGallery -TrustRepository -Path "$env:ProgramFiles\WindowsPowerShell\Modules"

      - name: Test application and Release packages
        shell: pwsh
        run: ./scripts/test.ps1 -RequireInstaller

      - name: Check NuGet dependency licenses (SPDX allowlist)
        shell: pwsh
        run: ./scripts/check-licenses.ps1

      - name: Save verification report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-report
          path: |
            dist/test-report.json
            dist/ui-preview/
          if-no-files-found: warn

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.5"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Check formatting (ruff, prettier, shfmt)
        run: bash scripts/format.sh --check
