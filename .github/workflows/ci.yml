name: Windows validation

# Builds the executable and the installer on Linux and tests these exact
# files on Windows. Dispatched by hand, it builds the 0.0.0 placeholder and
# runs everything; Release calls it with the release version and publishes
# what it built. Release skips the gate (the Linux gate job and the Go tests
# on Windows) unless its gate input is on; the build, the smoke run and the
# installer test of the published files always run.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version stamped on the build; empty keeps the 0.0.0 placeholder
        type: string
        default: ""
      skip_gate:
        description: Skip the gate (scripts/check.sh and the Go tests on Windows); build, smoke and installer test still run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # The development machine's release: the same NSIS package builds the
    # installer here and locally, and a fixed image keeps it fixed.
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The image's package lists usually still name NSIS and HarfBuzz's
      # tools; refreshing them only when the install fails skips a slow
      # update. tools/fonts cuts the faces with hb-subset.
      - name: Install NSIS and hb-subset
        run: |
          install() { sudo apt-get install -y -qq --no-install-recommends nsis libharfbuzz-bin; }
          install || { sudo apt-get update -qq && install; }
          makensis -VERSION
          hb-subset --version

      - name: Fetch MiSans (pinned SHA-256) and cut it for the app's text
        run: go run ./tools/fonts

      # mygo.json carries the 0.0.0 placeholder, which the tests check; this
      # checkout only builds, so stamping the version here leaves every
      # test's checkout as committed.
      - name: Write release version into mygo.json
        if: inputs.version
        env:
          VERSION: ${{ inputs.version }}
        run: go run ./tools/release set-version -version "$VERSION"

      - name: Build executable and installer
        run: go tool mygo build -platform windows/amd64

      - name: Save the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: dist/windows-amd64
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test on Windows
        if: ${{ !inputs.skip_gate }}
        run: go test -count=1 ./...

      # The runner is elevated and thrown away afterwards: the live tests may
      # register tasks and write below Program Files.
      - name: Test autostart against Task Scheduler
        if: ${{ !inputs.skip_gate }}
        env:
          POWERMETER_LIVE: "1"
        run: go test -count=1 ./internal/autostart

      - name: Fetch the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: dist/windows-amd64

      - name: Smoke-test the executable
        run: go run ./tools/release smoke -exe dist/windows-amd64/PowerMeter.exe -work "$RUNNER_TEMP/smoke"

      - name: Install, reinstall and uninstall
        env:
          VERSION: ${{ inputs.version || '0.0.0' }}
        run: go run ./tools/release install-test -version "$VERSION" -build dist/windows-amd64

      - name: Save smoke outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn

  gate:
    if: ${{ !inputs.skip_gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Gate (scripts/check.sh)
        run: bash scripts/check.sh
